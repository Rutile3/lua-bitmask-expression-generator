<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>Lua ビットマスク判定式ジェネレータ</title>
    <link rel="icon" href="favicon.png" type="image/png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-501GNTE7BK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-501GNTE7BK');
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-dark bg-brand shadow-sm">
        <div class="container-md d-flex align-items-center">
            <a href="https://github.com/Rutile3/lua-bitmask-expression-generator" class="navbar-brand fw-bold">Lua ビットマスク判定式ジェネレータ</a>
            <a href="https://link-hub.rutile3.com/" target="_blank" rel="noopener"
                class="d-flex align-items-center text-decoration-none ms-auto">
                <span class="text-white small ms-auto">by Rutile3</span>
                <img src="avatar.png" alt="Avatar" class="avatar ms-2">
            </a>
        </div>
    </header>

    <main class="flex-fill container-md my-4">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-light d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <span class="fw-semibold">入力</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="set" class="form-label fw-semibold">整数の集合（カンマ/空白/改行区切り）</label>
                            <input id="set" name="set" type="text" class="form-control" placeholder="例: -4, -2, 1, 3, 5" required="">
                        </div>
                        <div class="mb-4">
                        ・TODO:範囲指定
                        </div> 
                        <div class="d-grid gap-2 d-sm-flex">
                            <button id="generate-button" type="button" class="btn btn-primary flex-sm-fill">
                                生成
                            </button>
                            <button id="clear-button" type="button" class="btn btn-outline-secondary flex-sm-fill">
                                クリア
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-light d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <span class="fw-semibold">出力</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="constDec" class="form-label fw-semibold">整数ビットマスク</label>
                            <div class="input-group">
                                <input id="constDec" name="constDec" type="text" class="form-control" value="-" readonly>
                                <button id="constDecCopyButton" type="button" class="btn btn-outline-secondary" data-copy="constDec">コピー</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="constBin" class="form-label fw-semibold">バイナリビットマスク</label>
                            <div class="input-group">
                                <input id="constBin" name="constBin" type="text" class="form-control" value="-" readonly>
                                <button id="constBinCopyButton" type="button" class="btn btn-outline-secondary" data-copy="constBin">コピー</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="offset" class="form-label fw-semibold">オフセット</label>
                            <div class="input-group">
                                <input id="offset" name="offset" type="text" class="form-control" value="-" readonly>
                                <button id="offsetCopyButton" type="button" class="btn btn-outline-secondary" data-copy="offset">コピー</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="luaReadable" class="form-label fw-semibold">Lua 判定式（可読性重視）</label>
                            <div class="input-group">
                                <input id="luaReadable" name="luaReadable" type="text" class="form-control" value="-" readonly>
                                <button id="luaReadableCopyButton" type="button" class="btn btn-outline-secondary" data-copy="luaReadable">コピー</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="luaCompact" class="form-label fw-semibold">Lua 判定式（サイズ重視）</label>
                            <div class="input-group">
                                <input id="luaCompact" name="luaCompact" type="text" class="form-control" value="-" readonly>
                                <button id="luaCompactCopyButton" type="button" class="btn btn-outline-secondary" data-copy="luaCompact">コピー</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold">補足</div>
                    <div class="card-body">
                        <div class="form-text mt-2">
                            補足説明
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer py-3 bg-brand text-white">
        <div class="container-md small">
            <span>© 2025 Rutile3 | MIT License</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
